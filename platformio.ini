; ESP32 + Nextion only (no ST7735 panel). Same board and web UI.
[env:esp32dev-nextion]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags}
	-DNEXTION_ENABLED=1
	-DST7735_ENABLED=0

[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
	--auth=lacakota

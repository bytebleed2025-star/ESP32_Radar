; ---------------------------------------------------------------------------
;  DETEKTOR AIR LACAK — ESP32 + HC-SR04 + SG90
;
;  PlatformIO build (the same sketch also works in the Arduino IDE).
;
;    pio run                 build
;    pio run -t upload       flash
;    pio device monitor      serial monitor (115200)
;
;  Install the PlatformIO IDE extension / PlatformIO Core, then open this
;  folder as the project. Dependencies are downloaded automatically.
; ---------------------------------------------------------------------------

[platformio]
src_dir = firmware/ESP32_Radar
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Two OTA app slots (1.9 MB each) + small SPIFFS partition.
; Required for the Config-tab web OTA and ArduinoOTA.
board_build.partitions = min_spiffs.csv

; Web UI is embedded into the firmware by tools/build_assets.py, so no
; filesystem / LittleFS upload is needed.
lib_deps =
    madhephaestus/ESP32Servo@^3.2.1
    links2004/WebSockets@^2.7.2
    bodmer/TFT_eSPI@^2.5.43

; ST7735 128x160, no touch. HSPI is used so the radar pins are untouched.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DST7735_INITB=1
    -DTFT_MISO=-1
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=27
    -DTFT_DC=26
    -DTFT_RST=25
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT1=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=27000000
    -DTFT_RGB_ORDER=TFT_BGR

; Optional network OTA env (ArduinoOTA, port 3232).
;   pio run -e ota -t upload --upload-port 192.168.4.1
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=lacakota
